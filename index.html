<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA MADRINA | Showroom.</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #25D366;
            --neon-yellow: #f1c40f;
            --neon-pink: #e91e63;
            --bg-dark: #1a1a2e;
            --bg-violet: #16213e;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-violet), #0f3460);
            background-size: 400% 400%;
            animation: moverFondo 15s ease infinite;
            color: white;
            overflow-x: hidden;
        }

        @keyframes moverFondo {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        header {
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        /* ===== LOGO CONTAINER ===== */
        .logo-container {
            position: relative;
            display: inline-block;
            margin: 20px auto;
            max-width: 680px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 30px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow:
                0 0 40px rgba(241, 196, 15, 0.4),
                0 0 80px rgba(233, 30, 99, 0.15),
                0 20px 60px rgba(0, 0, 0, 0.6);
            animation: flotarLogo 4s ease-in-out infinite;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Borde animado tipo neón */
        .logo-container::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 32px;
            background: linear-gradient(45deg, #f1c40f, #e91e63, #00e5ff, #f1c40f);
            background-size: 300% 300%;
            animation: brillarBorde 3s linear infinite;
            z-index: -1;
            filter: blur(6px);
            opacity: 0.7;
        }

        @keyframes brillarBorde {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .logo-img {
            width: 100%;
            max-width: 580px;
            border-radius: 18px;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(255, 255, 255, 0.1);
            display: block;
            margin: 0 auto;
        }

        .logo-caption {
            margin-top: 18px;
            font-size: 1.3em;
            font-weight: 900;
            color: #fff;
            text-shadow:
                0 0 15px rgba(255, 255, 255, 0.8),
                0 0 30px rgba(241, 196, 15, 0.6);
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #f1c40f, #fff, #e91e63);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: brillarTexto 3s linear infinite;
        }

        @keyframes brillarTexto {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes flotarLogo {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* ===== SUBTÍTULO ===== */
        .subtitulo {
            font-size: 1.2em;
            color: #bdc3c7;
            margin-top: 25px;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 80px;
        }

        /* ===== SECCIÓN CATEGORÍA ===== */
        .category-section {
            width: 100%;
        }

        .category-title {
            text-align: center;
            font-size: 2.8em;
            font-weight: 900;
            margin-bottom: 30px;
            text-transform: uppercase;
            display: inline-block;
            width: 100%;
            color: white;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff;
            border-bottom: 6px solid;
            border-image: linear-gradient(45deg, #25D366, #e91e63, #00e5ff) 1;
            padding-bottom: 15px;
            box-sizing: border-box;
        }

        /* ===== CUADRÍCULA PRODUCTOS ===== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            align-items: center;
            justify-items: center;
        }

        .producto {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            max-width: 400px;
            animation: flotar 4s ease-in-out infinite;
        }

        .producto:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: var(--neon-yellow);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(241, 196, 15, 0.3);
        }

        .producto:nth-child(2) {
            animation-delay: 2s;
        }

        @keyframes flotar {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .img-wrapper {
            position: relative;
            overflow: hidden;
            height: 280px;
        }

        .producto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .producto:hover img {
            transform: scale(1.2);
        }

        /* ===== ETIQUETA OFERTA ===== */
        .tag-oferta {
            position: absolute;
            top: 15px;
            right: -40px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            padding: 10px 50px;
            transform: rotate(45deg);
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        /* ===== INFO ===== */
        .info {
            padding: 25px;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
        }

        .titulo {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .precio {
            font-size: 2.5em;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.7);
            margin-bottom: 5px;
            display: inline-block;
        }

        .moneda {
            font-size: 0.7em;
            color: #ddd;
            font-weight: 500;
            vertical-align: super;
            margin-left: 2px;
        }

        /* ===== BOTÓN WHATSAPP ===== */
        .btn-whatsapp {
            background-color: var(--neon-green);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-size: 1.2em;
            font-weight: 700;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-whatsapp::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .btn-whatsapp:hover::after {
            left: 100%;
        }

        .btn-whatsapp:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(37, 211, 102, 0.8);
        }

        .icon-wa {
            width: 25px;
            height: 25px;
            fill: white;
            flex-shrink: 0;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 0.9em;
            color: #888;
            letter-spacing: 1px;
        }
    </style>
</head>

    <script>
        function contactar(nombreProducto, precio) {
            const mensaje = `Hola estoy interesado en este producto ${nombreProducto} y su precio es ${precio} USD`;

            const numero = "5352164763";

            const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;

            window.open(url, '_blank');
        }
    </script>
